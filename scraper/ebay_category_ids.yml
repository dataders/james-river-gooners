# eBay L1 (top-level) category IDs, keyed by our broad category GROUP (an item's
# normalized `category`). ebay_query.py attaches the mapped id as the `categoryId`
# param on the PRECISE comp query, scoping it to the right marketplace department
# so a "Rosenthal vase" comp can't drift into, say, Auto Parts. Only the specific
# tier carries it, so an over-narrow category falls through to the broad/category
# tiers (graceful degradation) rather than starving recall.
#
# Values verified against eBay's published top-level (L1) category set. (The live
# eBay site and the sold-comps category browser are both bot-blocked / JS-only, so
# these are the stable canonical L1 IDs, not scraped.) `"0"` = NO category filter,
# used only where a group has no single correct L1 — see the unfiltered block.

# ── Mapped to a single, unambiguous eBay L1 department ───────────────────────────
Art: "550"                      # Art
China & Glass: "870"            # Pottery & Glass
Collectibles: "1"               # Collectibles
Coins & Currency: "11116"       # Coins & Paper Money
Jewelry & Watches: "281"        # Jewelry & Watches
Silver & Metal: "20081"         # Antiques (estate sterling/metalware lives here)
Furniture: "11700"              # Home & Garden (eBay's Furniture department)
Home & Kitchen: "11700"         # Home & Garden
Lawn & Garden: "11700"          # Home & Garden (Yard, Garden & Outdoor Living)
Fashion: "11450"                # Clothing, Shoes & Accessories
Toys & Games: "220"             # Toys & Hobbies
Books & Media: "267"            # Books & Magazines
Sporting Goods: "888"           # Sporting Goods
Electronics: "293"              # Consumer Electronics
Industrial & Equipment: "12576" # Business & Industrial
Stamps: "260"                   # Stamps

# ── Intentionally unfiltered ("0") ───────────────────────────────────────────────
# No single correct L1, a separate vertical, or prohibited on eBay — a keyword-only
# search is safer than forcing a wrong category. Revisit if/when Phase 2 maps lots
# to leaf categories (then most of these can resolve to a specific leaf id).
Trading Cards: "0"    # split: sports cards (64482) vs CCG/TCG (under Toys & Hobbies)
Rugs & Textiles: "0"  # split: antique/oriental rugs (Antiques) vs H&G rugs + linens
Hobbies: "0"          # spans crafts, drones, aviation, musical instruments
Seasonal: "0"         # split: vintage holiday collectibles vs modern decor
Vehicles: "0"         # eBay Motors is a separate vertical with its own comp dynamics
Firearms: "0"         # firearms are prohibited on eBay — no valid category
Ammunition: "0"       # prohibited on eBay
Science & Nature: "0" # split: rocks/minerals (Collectibles) vs lab gear (B&I) vs taxidermy
Pets & Kids: "0"      # split: pet supplies, baby goods, exercise equipment
Pet Adoption: "0"     # adoption listings — not a sellable eBay category
