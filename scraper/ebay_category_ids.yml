# eBay L1 (top-level) category IDs, keyed by our broad category GROUP
# (an item's normalized `category`). Used by ebay_query.py to scope the precise
# /v1/scrape comp query to the right marketplace category — a category-matched
# search keeps a "Rosenthal vase" comp out of, say, Auto Parts.
#
# Values are eBay L1 category IDs (strings); `"0"` means NO category filter
# (used for groups whose right L1 is ambiguous or spans several — better an
# unfiltered query than a wrong-category one that returns junk). Only attached
# to the precise/specific tier, so an over-narrow category never starves the
# broad/category fallbacks of recall.
#
# Refine / verify against https://sold-comps.com/ebay-categories .

