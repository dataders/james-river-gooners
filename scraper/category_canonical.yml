# =============================================================================
# Canonical, source-aware category mapping  (schema version 1)
# =============================================================================
#
# WHY THIS FILE EXISTS
# --------------------
# The legacy `category_mappings.yml` is a single source-blind alias table plus a
# description-keyword fallback that *silently overrides* unrecognized raw
# categories. That fallback made the mapping non-deterministic: the same raw
# category landed in different groups depending on the item's description text
# (e.g. Rasmus "Ind & Warehouse Eqpt" -> mostly Other but sometimes
# "Jewelry & Watches"; HiBid "US" -> Collectibles / Coins / Books). It also has
# no vocabulary for Rasmus's industrial inventory, so ~50% of Rasmus lots fall
# to Other.
#
# This file is the canonicalized replacement: a flat, reviewable,
# SOURCE-AWARE table of   (source, raw_category) -> subcategory -> group.
# It is the single source of truth; the Supabase `category_mappings` table and
# its JSON export are generated from it by `build_category_table.py`.
#
# THREE LAYERS
# ------------
#   groups          The closed set of top-level display groups (filter chips).
#   subcategories   Canonical mid-level display name -> group it rolls up to.
#   mappings        raw site category (lowercased) -> subcategory, scoped by
#                   source. `common` applies to every source; a per-source
#                   entry (cannons/hibid/rasmus) overrides `common`.
#   inference       Last-resort keyword inference from the item title/
#                   description, used ONLY when the raw category is missing or
#                   maps to `__unknown__`. Unlike the legacy file, inference can
#                   never override a raw category that the table already knows.
#
# A subcategory of `__unknown__` is an explicit "no usable category" marker:
# it routes to `Other` after inference, and (critically) it does NOT pretend the
# raw string was a real category. Use it for raw leaves that are not categories
# at all (HiBid coin-denomination crumbs, sports-player-name crumbs, literal
# item titles).
#
# Matching is case-insensitive; keys here are lowercased. Edit this file to
# adjust categorization, then run `build_category_table.py` to regenerate the
# Supabase migration and JSON export and to print a coverage report.

version: 1

# -----------------------------------------------------------------------------
# Top-level groups (display order). Two are new vs the legacy taxonomy:
#   - "Industrial & Equipment": gives Rasmus's warehouse/industrial lots a home.
#   - "Health & Beauty": split out of Fashion (cosmetics/medical aren't apparel).
# "Vehicles" is broadened to cover auto parts & marine, not just whole vehicles.
# -----------------------------------------------------------------------------
groups:
  - Art
  - China & Glass
  - Silver & Metal
  - Furniture
  - Jewelry & Watches
  - Coins & Currency
  - Firearms
  - Books & Media
  - Electronics
  - Home & Kitchen
  - Fashion
  - Health & Beauty
  - Toys & Games
  - Rugs & Textiles
  - Lawn & Garden
  - Sporting Goods
  - Hobbies
  - Tools & Hardware
  - Industrial & Equipment
  - Collectibles
  - Seasonal
  - Vehicles
  - Science & Nature
  - Pets & Kids
  - Other

