  # HiBid breadcrumb leaves. HiBid's leaf crumb is frequently NOT a category:
  #   - coin auctions expose a denomination ("Half Dollars", "Quarters", ...)
  #   - sports-card auctions expose a player name ("Will Clark", ...)
  #   - some lots expose the literal item title.
  # Denominations roll up to Coins & Currency. Player-name and item-title leaves
  # are unknowable from a static list, so they fall to `__unknown__` and then to
  # inference (see the `inference` block) -> usually Collectibles for cards.
  # NOTE: "US" / "International" / "Canada" / "World" are a COUNTRY facet, not a
  # category; they are genuinely ambiguous (coins vs stamps vs cards) and need
  # the parent breadcrumb the scraper currently drops. Marked __unknown__.
  hibid:
    # coin denominations -> Coins & Currency
    dollars: Coins & Currency
    half dollars: Coins & Currency
