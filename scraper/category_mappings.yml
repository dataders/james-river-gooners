  lowboy: [Furniture, Furniture]
  wall shelf: [Furniture, Furniture]
  mirror: [Mirrors, Furniture]
  # -- Lighting / clocks
  chandelier: [Lighting, Home & Kitchen]
  sconce: [Lighting, Home & Kitchen]
  lamp: [Lighting, Home & Kitchen]
  lantern: [Lighting, Home & Kitchen]
  clock: [Clocks, Home & Kitchen]
  # -- Pictures
