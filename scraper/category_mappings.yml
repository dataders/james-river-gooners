# Shared category mappings for all auction sources (Maxanet/Cannon's + HiBid).
#
# Three layers:
# 1. raw_aliases: maps messy site category names -> canonical display names.
#    Most variants below are Cannon's/Maxanet site strings, but HiBid breadcrumb
#    crumbs also match here, so do not prune entries just because they look
#    Maxanet-specific.
# 2. groups: maps canonical names -> broad groups (via substring matching)
# 3. description_keywords: infers category from item title/description when the
#    raw category is missing or unrecognized. HiBid leans on this layer heavily.
#
# Edit this file to adjust categorization. Both scrapers read it at runtime.

