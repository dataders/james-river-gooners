  # Description-driven recovery for lots whose site Type is "Other"/unmapped and
  # whose detail lives entirely in the description (Cannon's "Lot - N"
  # placeholders). Ordered by reliability since the first matching keyword wins:
  #   1. furniture / lighting / clock object nouns (so "cherry chest with brass
  #      pulls" → Furniture, not Silver via the hardware; "table lamp" → Lighting)
  #   2. pictures
  #   3. metals (so a "sterling platter" / "brass bowl" → Silver/Metal, not China)
  #   4. edged / jewelry / money / paper / seasonal / model collectibles
  #   5. china / glass object nouns
  #   6. textiles, garden, household, tools
  #   7. bare material / decorative catch-alls last
  # -- Lamp compounds first, so "table lamp" → Lighting, not Furniture via "table"
  table lamp: [Lighting, Home & Kitchen]
  floor lamp: [Lighting, Home & Kitchen]
  desk lamp: [Lighting, Home & Kitchen]
  # -- Furniture
  cabinet: [Furniture, Furniture]
  table: [Furniture, Furniture]
  chair: [Furniture, Furniture]
  desk: [Furniture, Furniture]
  stool: [Furniture, Furniture]
  hutch: [Furniture, Furniture]
