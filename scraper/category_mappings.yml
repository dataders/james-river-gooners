  painting: [Paintings & Prints, Art]
  engraving: [Paintings & Prints, Art]
  framed: [Paintings & Prints, Art]
  poster: [Paintings & Prints, Art]
  canvas: [Paintings & Prints, Art]
  # -- Metals (beat the generic china nouns below for silver/brass hollowware)
  sterling: [Sterling & Silverplate, Silver & Metal]
  silverplated: [Sterling & Silverplate, Silver & Metal]
  silver plate: [Sterling & Silverplate, Silver & Metal]
  silver: [Sterling & Silverplate, Silver & Metal]
  brass: [Brassware & Copper, Silver & Metal]
  copper: [Brassware & Copper, Silver & Metal]
  cast iron: [Cast Iron, Silver & Metal]
