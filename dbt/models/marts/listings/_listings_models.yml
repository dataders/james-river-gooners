version: 2

models:
  - name: fct_category_trends
    description: >
      Category performance trends with rolling averages and multi-period comparisons.
      Builds on fct_category_monthly_stats — adds 3-month and 12-month lookbacks,
      rolling 7-day smoothed price/volume, category volume rankings, and momentum
      signals (rising/falling/stable/new). Grain: (category, sold_month, source).
    columns:
      - name: category
        tests: [not_null]
      - name: sold_month
        tests: [not_null]
      - name: rolling_3m_median_price
        description: >
          3-month rolling average of the monthly median price. Smooths one-off
          auction spikes — use this instead of raw median_price for trend charts.
      - name: volume_momentum
        description: >
          Category rank movement over 3 months: rising (rank improved), falling
          (rank dropped), stable (same rank), new (no data 3 months ago).
        tests:
          - accepted_values:
              values: ['rising', 'falling', 'stable', 'new']
              where: "volume_momentum is not null"
      - name: price_trend_signal
        description: >
          Whether this month's median price is above trend (>5% above rolling 3m avg),
          below trend (>5% below), or on trend. Null when insufficient history.
        tests:
          - accepted_values:
              values: ['above_trend', 'below_trend', 'on_trend']
              where: "price_trend_signal is not null"

  - name: dim_auctions
    description: >
      One row per auction with aggregate sold-lot stats. Only auctions with
      at least one lot sold above the min_sold_price threshold appear.
    columns:
      - name: auction_safe_id
        tests: [not_null, unique]
      - name: lots_sold
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: total_gmv
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: dim_categories
    description: >
      One row per category with lifetime sell-through stats across all sources
      and auctions. Ordered by lifetime GMV descending.
    columns:
      - name: category
        tests: [not_null, unique]
      - name: lifetime_lots_sold
        tests:
          - dbt_utils.accepted_range:
              min_value: 1

  - name: fct_lot_bidding
    description: >
      One row per sold lot. Combines realized price, bidding intensity ratios,
      enrichment context, and comp benchmarks for detailed per-lot analysis.
    columns:
      - name: auction_safe_id
        tests: [not_null]
      - name: item_id
        tests: [not_null]
      - name: final_bid
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: bids_per_bidder
        description: >
          Average number of bids each bidder placed. High values indicate
          a contested back-and-forth between a small group of determined bidders.
      - name: pct_vs_ebay_comp
        description: >
          Percentage premium (positive) or discount (negative) relative to the
          best matching eBay sold comp. Null when no eBay comp exists.

  - name: fct_category_monthly_stats
    description: >
      Historical listing performance by category × month × source. Use for
      trend charts and seasonality analysis.
    columns:
      - name: category
        tests: [not_null]
      - name: sold_month
        tests: [not_null]
      - name: lots_sold
        tests:
          - dbt_utils.accepted_range:
              min_value: 1

  - name: fct_auction_stats
    description: >
      Per-auction summary: GMV, bidding intensity, price distribution, category
      breadth, and top category by revenue.
    columns:
      - name: auction_safe_id
        tests: [not_null, unique]
      - name: lots_sold
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: pct_competitive
        description: Percentage of lots with 2+ unique bidders.
