version: 2

sources:
  - name: posthog_raw
    description: >
      PostHog behavioral event aggregates exported to MotherDuck by
      scraper/posthog_export.py. Requires POSTHOG_PERSONAL_KEY + MOTHERDUCK_TOKEN.
      Refresh manually or via a scheduled workflow.
    schema: posthog_raw
    tables:
      - name: events_daily
        description: "Daily event counts per event type. Grain: (day, event)."
        columns:
          - name: day
            tests: [not_null]
          - name: event
            tests: [not_null]
          - name: cnt
            tests: [not_null]
      - name: search_stats
        description: Daily search stats split by semantic vs keyword mode.
        columns:
          - name: day
            tests: [not_null]
      - name: toggle_stats
        description: Daily favorite/ignore toggle counts split by direction and auth state.
        columns:
          - name: day
            tests: [not_null]


  - name: supabase_metrics
    description: >
      Supabase platform telemetry (host load, database internals, service layer)
      scraped from the project's privileged Prometheus endpoint and loaded by
      supabase_stats/pipeline.py (dlt). Lives in the dedicated supabase_metrics
      schema of the attached Supabase Postgres — NOT an RLS-public app table.
      Long-format: one row per (scraped_at, metric, label set).
    database: supabase   # alias set in profiles.yml attach config
    schema: supabase_metrics
    tables:
      - name: metric_samples
        description: >
          One point-in-time sample per metric series per scrape run. Counters are
          cumulative (diff over a window for rates); gauges are instantaneous.
        columns:
          - name: scraped_at
            description: Scrape time (UTC), shared by every row in a run.
            tests: [not_null]
          - name: metric
            description: Prometheus metric name (e.g. node_load1, pg_stat_database_blks_hit).
            tests: [not_null]
          - name: metric_type
            description: Prometheus type — counter, gauge, or untyped.
          - name: subsystem
            description: host / database / auth / storage / realtime / other.
          - name: pillar
            description: reliability / load / performance (null for uncurated metrics).
          - name: labels_json
            description: Sorted JSON of the series' Prometheus labels.
          - name: label_hash
            description: Stable short hash of the label set — the per-series identity.
          - name: value
            description: Sample value (finite floats only; NaN/Inf dropped on load).
            tests: [not_null]

  - name: gooners
    description: Supabase Postgres tables, attached to DuckDB read-only as the "supabase" database.
    database: supabase   # alias set in profiles.yml attach config
    schema: public
    tables:
      - name: sold_lots
        description: >
          Every closed lot's final hammer price. Written by scraper/sold_history.py
          from the archive NDJSON. Only lots with final_bid > 0 are meaningful.
        columns:
          - name: auction_safe_id
            tests: [not_null]
          - name: item_id
            tests: [not_null]
          - name: final_bid
            description: Realized hammer price in USD.
          - name: total_bids
          - name: unique_bidders
          - name: sold_at
            description: Auction end timestamp (UTC).
          - name: source
            description: Originating scraper — cannons, hibid, or rasmus.

      - name: lots
        description: Active and archived lot listings.
        columns:
          - name: auction_safe_id
            tests: [not_null]
          - name: item_id
            tests: [not_null]
          - name: archived
            description: True once the auction is moved to the archive.

      - name: lot_enrichment
        description: >
          LLM-extracted product metadata (brand, model, condition) for lots where
          Claude Haiku identified a specific product with medium or high confidence.

      - name: ebay_comp_snapshots
        description: >
          eBay sold-listing comps fetched by the scraper. Multiple rows per lot.
          Pruned after 90 days.

      - name: cannons_comp_snapshots
        description: >
          Cannon's own CLIP comps: most similar archived lots for each active lot.
          Multiple rows per lot per scraper run (rank 0-based). Only latest generation
          is current.

      - name: favorites
        description: One row per (user, favorited item). item_key = "<auctionSafeId>:<itemId>".

      - name: ignored
        description: One row per (user, ignored item). Same item_key format.

      - name: users
        description: One row per registered app user (backend-only, bypasses RLS via direct Postgres).

  - name: github_stats
    description: >
      This repo's GitHub activity, loaded straight into MotherDuck (my_db,
      schema github_stats) by the dlt pipeline in github_stats/. Analytics-only
      (not read by the app), so it lives natively in the warehouse the dashboard
      reads — no Postgres hop. Raw entity tables; dlt manages their schema and
      loads them incrementally.
    schema: github_stats   # native MotherDuck (my_db), like posthog_raw
    tables:
      - name: workflow_runs
        description: >
          One row per GitHub Actions workflow run. Carries computed
          duration_seconds + boolean succeeded/failed derived from conclusion.
        columns:
          - name: id
            tests: [not_null, unique]
          - name: name
            description: Workflow display name (e.g. "Test", "Scrape Auction Data").
          - name: duration_seconds
          - name: conclusion
          - name: created_at
      - name: pull_requests
        description: One row per pull request. merged + hours_to_merge precomputed.
        columns:
          - name: id
            tests: [not_null, unique]
          - name: number
            tests: [not_null]
          - name: merged
          - name: hours_to_merge
      - name: issues
        description: >
          One row per issue. The GitHub issues endpoint also returns PRs, so
          is_pull_request flags those (staging filters them out).
        columns:
          - name: id
            tests: [not_null, unique]
          - name: is_pull_request
      - name: commits
        description: One row per commit on the default branch.
        columns:
          - name: sha
            tests: [not_null, unique]
      - name: scraper_run_metrics
        description: >
          Items processed per scraper run, parsed from workflow-run logs.
          Grain: (run_id, metric) — e.g. items_scraped, lots_upserted.
        columns:
          - name: run_id
            tests: [not_null]
          - name: metric
            tests: [not_null]
          - name: value
