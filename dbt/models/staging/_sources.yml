version: 2

sources:
  - name: gooners
    description: Supabase Postgres tables, attached to DuckDB read-only as the "supabase" database.
    database: supabase   # alias set in profiles.yml attach config
    schema: public
    tables:
      - name: sold_lots
        description: >
          Every closed lot's final hammer price. Written by scraper/sold_history.py
          from the archive NDJSON. Only lots with final_bid > 0 are meaningful.
        columns:
          - name: auction_safe_id
            tests: [not_null]
          - name: item_id
            tests: [not_null]
          - name: final_bid
            description: Realized hammer price in USD.
          - name: total_bids
          - name: unique_bidders
          - name: sold_at
            description: Auction end timestamp (UTC).
          - name: source
            description: Originating scraper — cannons, hibid, or rasmus.

      - name: lots
        description: Active and archived lot listings.
        columns:
          - name: auction_safe_id
            tests: [not_null]
          - name: item_id
            tests: [not_null]
          - name: archived
            description: True once the auction is moved to the archive.

      - name: lot_enrichment
        description: >
          LLM-extracted product metadata (brand, model, condition) for lots where
          Claude Haiku identified a specific product with medium or high confidence.

      - name: ebay_comp_snapshots
        description: >
          eBay sold-listing comps fetched by the scraper. Multiple rows per lot.
          Pruned after 90 days.

      - name: cannons_comp_snapshots
        description: >
          Cannon's own CLIP comps: most similar archived lots for each active lot.
          Multiple rows per lot per scraper run (rank 0-based). Only latest generation
          is current.

      - name: favorites
        description: One row per (user, favorited item). item_key = "<auctionSafeId>:<itemId>".

      - name: ignored
        description: One row per (user, ignored item). Same item_key format.

      - name: users
        description: One row per registered app user (backend-only, bypasses RLS via direct Postgres).
