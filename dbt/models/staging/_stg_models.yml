version: 2

models:
  - name: stg_sold_lots
    description: >
      Closed lots with a realized price > $1. One row per (auction_safe_id, item_id).
      Adds derived time dimensions and price buckets.
    columns:
      - name: auction_safe_id
        tests: [not_null]
      - name: item_id
        tests: [not_null]
      - name: final_bid
        description: Hammer price in USD. Always > min_sold_price (var).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: source
        tests:
          - accepted_values:
              values: ['cannons', 'hibid', 'rasmus']
      - name: price_bucket
        tests: [not_null]

  - name: stg_lots
    description: Active and archived lots. One row per (auction_safe_id, item_id).
    columns:
      - name: auction_safe_id
        tests: [not_null]
      - name: item_id
        tests: [not_null]

  - name: stg_lot_enrichment
    description: >
      LLM-identified lots (medium/high confidence only). One row per
      (auction_safe_id, item_id). Adds confidence_rank ordinal.
    columns:
      - name: auction_safe_id
        tests: [not_null]
      - name: item_id
        tests: [not_null]
      - name: confidence
        tests:
          - accepted_values:
              values: ['medium', 'high']

  - name: stg_ebay_comp_snapshots
    description: >
      eBay sold-comp rows where item_web_url is not null (i.e. a listing was
      matched). Multiple rows per lot possible — dedup in mart layer.
    columns:
      - name: auction_safe_id
        tests: [not_null]
      - name: item_id
        tests: [not_null]

  - name: stg_cannons_comp_snapshots
    description: >
      Latest-generation Cannon's CLIP comps only. Up to top-K rows per lot
      (rank 0 = most similar archived lot).
    columns:
      - name: auction_safe_id
        tests: [not_null]
      - name: item_id
        tests: [not_null]
      - name: comp_rank
        description: 0-based position within the item's comp set (0 = best match).

  - name: stg_favorites
    description: >
      User favorites with item_key parsed into auction_safe_id + item_id
      and time-of-day dimensions added.
    columns:
      - name: user_id
        tests: [not_null]
      - name: item_key
        tests: [not_null]
      - name: auction_safe_id
        tests: [not_null]
      - name: item_id
        tests: [not_null]

  - name: stg_ignored
    description: User ignored items. Same structure as stg_favorites.
    columns:
      - name: user_id
        tests: [not_null]
      - name: item_key
        tests: [not_null]

  - name: stg_users
    description: Registered app users with tenure and activity flags.
    columns:
      - name: user_id
        tests: [not_null, unique]

  - name: stg_posthog_events
    description: "Daily PostHog event counts from posthog_raw.events_daily. Grain: (day, event)."
    columns:
      - name: day
        tests: [not_null]
      - name: event
        tests: [not_null]
      - name: event_count
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: stg_posthog_search_stats
    description: Daily search stats from PostHog split by semantic/keyword mode.
    columns:
      - name: day
        tests: [not_null]

  - name: stg_posthog_toggle_stats
    description: Daily favorite/ignore toggle counts from PostHog.
    columns:
      - name: day
        tests: [not_null]
      - name: event
        tests:
          - accepted_values:
              values: ['favorite_toggled', 'ignored_toggled']

  - name: stg_workflow_runs
    description: >
      One row per GitHub Actions workflow run, with outcome flags and derived
      time dimensions (run_date/week/hour/dow) + duration_minutes.
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: workflow_name
        tests: [not_null]
      - name: duration_seconds
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              where: "duration_seconds is not null"

  - name: stg_github_pull_requests
    description: >
      One row per pull request, with merge timing (hours_to_merge/days_to_merge)
      and a closed_unmerged flag.
    columns:
      - name: pr_id
        tests: [not_null, unique]
      - name: pr_number
        tests: [not_null]
      - name: state
        tests:
          - accepted_values:
              values: ['open', 'closed']

  - name: stg_github_issues
    description: True issues only (pull requests excluded). One row per issue.
    columns:
      - name: issue_id
        tests: [not_null, unique]
      - name: issue_number
        tests: [not_null]
      - name: state
        tests:
          - accepted_values:
              values: ['open', 'closed']

  - name: stg_github_commits
    description: One row per commit on the default branch.
    columns:
      - name: commit_sha
        tests: [not_null, unique]

  - name: stg_scraper_run_metrics
    description: >
      Items processed per scraper run, parsed from run logs.
      Grain: (run_id, metric).
    columns:
      - name: run_id
        tests: [not_null]
      - name: metric
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [run_id, metric]
