name: 'gooners_analytics'
version: '1.0.0'
config-version: 2

profile: 'gooners'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  min_sold_price: 1

models:
  gooners_analytics:
    staging:
      +materialized: view
      +schema: staging         # → my_db.gooners_staging
    intermediate:
      +materialized: view
      +schema: intermediate    # → my_db.gooners_intermediate
    marts:
      +materialized: table     # → my_db.gooners (target.schema, no suffix)
