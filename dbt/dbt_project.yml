name: 'gooners_analytics'
version: '1.0.0'
config-version: 2

profile: 'gooners'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Only sold lots at or above this threshold count toward price stats.
  min_sold_price: 1

models:
  gooners_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      listings:
        +schema: analytics
      product:
        +schema: analytics
      resale:
        +schema: analytics
