gooners:
  target: dev
  outputs:
    dev:
      type: duckdb
      # MotherDuck writes land in my_db; Supabase Postgres is attached read-only.
      path: "md:my_db?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: gooners          # mart tables → my_db.gooners.*
      attach:
        # SUPABASE_DB_ATTACH lets CI pass a complete connection string/URI
        # (e.g. the session-pooler `postgresql://…` URL, IPv4 — required on
        # GitHub runners). Falls back to the host/password (user=postgres) form
        # for local dev, so existing setups are unchanged.
        - path: "{{ env_var('SUPABASE_DB_ATTACH', 'host=' ~ env_var('SUPABASE_DB_HOST', '') ~ ' user=postgres password=' ~ env_var('SUPABASE_DB_PASSWORD', '') ~ ' dbname=postgres sslmode=require') }}"
          type: postgres
          alias: supabase
          read_only: true
      threads: 4

    prod:
      type: duckdb
      path: "md:my_db?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: gooners
      attach:
        # SUPABASE_DB_ATTACH lets CI pass a complete connection string/URI
        # (e.g. the session-pooler `postgresql://…` URL, IPv4 — required on
        # GitHub runners). Falls back to the host/password (user=postgres) form
        # for local dev, so existing setups are unchanged.
        - path: "{{ env_var('SUPABASE_DB_ATTACH', 'host=' ~ env_var('SUPABASE_DB_HOST', '') ~ ' user=postgres password=' ~ env_var('SUPABASE_DB_PASSWORD', '') ~ ' dbname=postgres sslmode=require') }}"
          type: postgres
          alias: supabase
          read_only: true
      threads: 8

    # Connectionless target for `dbt compile` in CI. An in-memory DuckDB with no
    # MotherDuck token and no Supabase attach — compile only resolves ref()/
    # source() names from config, so the real warehouse isn't needed and CI
    # stays secret-free. (`dbt build`/`run` still use dev/prod.)
    ci:
      type: duckdb
      path: ":memory:"
      schema: gooners
      threads: 4
