name: Backfill Nomic Embeddings

# One-time (re-runnable) backfill of Nomic text+vision embeddings into the
# Supabase ``nomic_embeddings`` pgvector table. Reads lot data from the
# Supabase ``lots`` table (no committed NDJSON needed). The hourly scrape
# embeds *active* lots incrementally; this fills in the *archive* corpus that
# Cannon's comps need (issue #165 / CLIP→Nomic migration).
#
# Resumable: embed_nomic skips lots already in the table, so re-running only
# embeds what's still missing. CPU-only here — a full archive backfill is slow
# and may need several runs to complete (each run makes progress).
#
# Requires SUPABASE_SECRET_KEY (reads lots, writes embeddings).

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which lots to embed'
        required: false
        type: choice
        options:
          - archive-and-active
          - active-only
        default: archive-and-active
      safe_ids:
        description: 'Optional space-separated auction safeIds (blank = all in scope)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Cache HuggingFace models (Nomic text + vision)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-clip-vit-b-32-nomic-embed-v1.5

      - name: Backfill Nomic embeddings
        run: |
          cd scraper
          if [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "SUPABASE_SECRET_KEY not set — skipping"
            exit 1
          fi
          ARCHIVE_FLAG="--archive"
          if [ "${{ inputs.scope }}" = "active-only" ]; then
            ARCHIVE_FLAG=""
          fi
          GOONERS_NOMIC_EMBEDDINGS=1 uv run \
            --with sentence-transformers --with 'transformers==4.49.0' \
            --with torchvision --with pillow --with einops --with numpy --with requests \
            python embed_nomic.py --from-supabase $ARCHIVE_FLAG ${{ inputs.safe_ids }}
