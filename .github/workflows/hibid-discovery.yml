name: HiBid Daily Catalog Discovery

# Discovers newly listed catalogs for each company in hibid_sources.yml and
# commits any new catalog_ids so the hourly "Scrape Auction Data" workflow
# picks them up automatically. Uses Playwright to fetch HiBid company pages
# so bot protection is bypassed regardless of runner IP.

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC (6 am ET) daily
  workflow_dispatch:        # manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install Playwright Chromium
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Discover new HiBid catalogs
        run: |
          cd scraper && uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml --with ruamel.yaml --with playwright python discover_hibid.py

      - name: Commit updated catalog IDs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/hibid_sources.yml
          if git diff --cached --quiet; then
            echo "No new catalogs — nothing to commit."
            exit 0
          fi
          BRANCH="bot/hibid-discovery-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git commit -m "chore: update HiBid catalog IDs (daily discovery)"
          # A re-run (or a retried failure) on the same day lands on a branch that
          # already exists on origin, so a plain push is rejected as non-fast-forward.
          # The branch content is the bot's own deterministic daily output, so it's
          # safe to force-update it to the freshly discovered set.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin — force-updating it."
            git push -u origin "$BRANCH" --force
          else
            git push -u origin "$BRANCH"
          fi
          # Only open a PR if one isn't already open for this branch; otherwise the
          # force-push above has already updated the existing PR.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "An open PR for $BRANCH already exists — updated it via push, skipping create."
          else
            gh pr create \
              --title "chore: update HiBid catalog IDs (daily discovery)" \
              --body "Automated PR: new HiBid catalog IDs added to \`scraper/hibid_sources.yml\` by the daily discovery workflow." \
              --base main \
              --head "$BRANCH"
          fi
