name: HiBid Daily Catalog Discovery

# Discovers newly listed catalogs for each company in hibid_sources.yml and
# commits any new catalog_ids so the hourly "Scrape Auction Data" workflow
# picks them up automatically.

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC (6 am ET) daily
  workflow_dispatch:        # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Discover new HiBid catalogs
        run: |
          cd scraper && uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml --with ruamel.yaml python discover_hibid.py

      - name: Commit updated catalog IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/hibid_sources.yml
          git diff --cached --quiet || git commit -m "chore: update HiBid catalog IDs (daily discovery)" && git push
