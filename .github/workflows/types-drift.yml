# Fails if src/types/database.types.ts is out of sync with the live Supabase
# schema — i.e. a migration changed a table/view/function but the generated
# types weren't regenerated (`npm run gen:types`) and committed.
#
# Runs only when something schema-adjacent changes (the migrations, the types
# file itself, or the generator), so it never hits Supabase on an unrelated
# frontend PR. Needs a SUPABASE_ACCESS_TOKEN secret (a personal access token,
# sbp_…); the job SKIPS CLEANLY when that secret is absent, so it's inert until
# the token is added rather than red-X-ing every PR.
name: Types drift

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'src/types/database.types.ts'
      - 'scripts/gen-types.sh'
  workflow_dispatch:

# Read-only token: the job only checks out the repo and reads the schema.
permissions:
  contents: read

jobs:
  types-drift:
    name: Supabase types up to date
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate types and check for drift
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping types-drift check."
            echo "Add the secret to enable it (see CLAUDE.md → Environment variables)."
            exit 0
          fi
          npm run gen:types
          if ! git diff --exit-code src/types/database.types.ts; then
            echo "::error::src/types/database.types.ts is stale. Run 'npm run gen:types' and commit the result."
            exit 1
          fi
          echo "Supabase types are in sync."
