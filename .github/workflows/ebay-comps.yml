name: Refresh eBay Comps

# Comps-only workflow: fetches eBay sold-comp prices into the comps read model.
# With Supabase configured (#6) it writes to the `ebay_comp_snapshots` table and
# commits nothing; otherwise it updates the static JSON under
# public/data/ebay-comps/. Does NOT re-scrape auctions or rebuild manifests —
# use the "Scrape Auction Data" workflow for that.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test only — fetch but do not commit'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Max number of items to attempt this run'
        required: false
        type: string
        default: '2000'
      max_queries:
        description: 'Hard cap on requests this run (0 = none; monthly budget still applies)'
        required: false
        type: string
        default: '0'
      monthly_budget:
        description: 'Shared monthly request ceiling across all runs (0 disables; matches the SoldComps plan). The provider X-Usage-* header is the authoritative stop.'
        required: false
        type: string
        default: '50000'
      queries_per_item:
        description: 'Fallback queries per item (1=cheapest, 3=best match rate)'
        required: false
        type: string
        default: '2'
      refresh_existing:
        description: 'Also re-fetch items already attempted (off = backfill only)'
        required: false
        type: boolean
        default: false
      skip_categories:
        description: 'Comma-separated broad category groups to skip (e.g. "Collectibles,Jewelry & Watches,Coins & Currency,China & Glass")'
        required: false
        type: string
        default: ''
      no_daily_pacing:
        description: 'Spend full remaining monthly budget in one run instead of spreading across days'
        required: false
        type: boolean
        default: false
      backfill_from_json:
        description: 'One-time: copy existing public/data/ebay-comps/*.json into Supabase (no eBay requests) instead of fetching'
        required: false
        type: boolean
        default: false
      optional_features:
        description: 'Comma-separated opt-ins: sold_listings_corpus, leaf_categories'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  comps:
    runs-on: ubuntu-latest
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      SOLDCOMPS_API_KEY: ${{ secrets.SOLDCOMPS_API_KEY }}
      # eBay comps → Supabase (#6): the read model + ledger when configured.
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Server-side telemetry (scraper/telemetry.py): records SoldComps API
      # calls + remaining provider quota to PostHog. No-op when the key is absent.
      # Reuses the existing VITE_POSTHOG_KEY secret (same write-only ingestion key).
      GOONERS_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # One-time #6 cutover: copy the committed JSON read model into Supabase so
      # comps coverage doesn't drop when the frontend flips to Supabase-only.
      # Spends no eBay requests; skips the fetch path entirely.
      - name: Backfill comps from JSON to Supabase
        if: ${{ inputs.backfill_from_json }}
        run: |
          cd scraper
          uv run --with requests python backfill_comps_to_supabase.py

      - uses: actions/setup-node@v6
        if: ${{ ! inputs.backfill_from_json }}
        with:
          node-version: '20'

      - name: Install agent-browser Playwright deps
        if: ${{ ! inputs.backfill_from_json }}
        run: |
          npm exec --yes agent-browser@0.27.0 -- install
        env:
          npm_config_cache: ${{ runner.temp }}/npm-agent-browser
          AGENT_BROWSER_ARGS: --no-sandbox,--disable-blink-features=AutomationControlled

      - name: Refresh eBay comps
        if: ${{ ! inputs.backfill_from_json }}
        env:
          npm_config_cache: ${{ runner.temp }}/npm-agent-browser
          AGENT_BROWSER_ARGS: --no-sandbox,--disable-blink-features=AutomationControlled
          AGENT_BROWSER_SESSION: gooners-ebay-comps
          GOONERS_EBAY_COMPS_SKIP_CATEGORIES: ${{ inputs.skip_categories }}
          GOONERS_EBAY_COMPS_DRY_RUN: ${{ inputs.dry_run }}
          GOONERS_EBAY_COMPS_LIMIT_INPUT: ${{ inputs.limit }}
          GOONERS_EBAY_COMPS_MAX_QUERIES_INPUT: ${{ inputs.max_queries }}
          GOONERS_EBAY_COMPS_MONTHLY_BUDGET_INPUT: ${{ inputs.monthly_budget }}
          GOONERS_EBAY_COMPS_QUERIES_PER_ITEM_INPUT: ${{ inputs.queries_per_item }}
          GOONERS_EBAY_COMPS_REFRESH_EXISTING: ${{ inputs.refresh_existing }}
          GOONERS_EBAY_COMPS_NO_DAILY_PACING: ${{ inputs.no_daily_pacing }}
          GOONERS_EBAY_COMPS_FEATURES: ${{ inputs.optional_features }}
        run: |
          cd scraper
          FEATURES=",${GOONERS_EBAY_COMPS_FEATURES//[[:space:]]/},"
          case "$FEATURES" in
            *,sold_listings_corpus,*)
              export GOONERS_SOLD_LISTINGS_CORPUS=1
              ;;
          esac
          case "$FEATURES" in
            *,leaf_categories,*)
              export GOONERS_EBAY_LEAF_CATEGORIES=1
              ;;
          esac
          # Prefer Supabase (#6): the comps read model + ledger, so no JSON is
          # written. Otherwise write the static JSON and mirror to MotherDuck
          # when its token is present.
          if [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            export GOONERS_WAREHOUSE=supabase
          elif [ -n "${MOTHERDUCK_TOKEN:-}" ]; then
            export GOONERS_MOTHERDUCK_SNAPSHOTS=1
          fi
          # Backfill by default (skip already-attempted items); flip
          # refresh_existing on to re-fetch comps that already exist.
          SKIP_FLAG="--skip-attempted"
          if [ "${GOONERS_EBAY_COMPS_REFRESH_EXISTING}" = "true" ]; then
            SKIP_FLAG=""
          fi
          PACING_FLAG=""
          if [ "${GOONERS_EBAY_COMPS_NO_DAILY_PACING}" = "true" ]; then
            PACING_FLAG="--no-daily-pacing"
          fi
          # skip_categories is passed via GOONERS_EBAY_COMPS_SKIP_CATEGORIES env var
          # (values may contain spaces, e.g. "Jewelry & Watches"), which ebay_comps.py
          # reads as the --skip-categories default.
          # This comps-only workflow does not scrape, so there's no local read
          # model — source lots from Supabase (the active `lots` table +
          # enrichment) via --from-supabase.
          if [ "${GOONERS_EBAY_COMPS_DRY_RUN}" = "true" ]; then
            echo "Dry run: planning eBay comp fetch without writes"
            uv run --with requests --with beautifulsoup4 --with pyarrow --with 'duckdb==1.5.2' --with posthog \
              --with 'pydantic-settings>=2,<3' \
              python ebay_comps.py fetch-direct --dry-run --from-supabase --limit 1 --sleep-seconds 0 \
                --monthly-budget "${GOONERS_EBAY_COMPS_MONTHLY_BUDGET_INPUT}" \
                --queries-per-item "${GOONERS_EBAY_COMPS_QUERIES_PER_ITEM_INPUT}" $SKIP_FLAG $PACING_FLAG
          else
            uv run --with requests --with beautifulsoup4 --with pyarrow --with 'duckdb==1.5.2' --with posthog \
              --with 'pydantic-settings>=2,<3' \
              python ebay_comps.py fetch-direct \
                --from-supabase \
                --limit "${GOONERS_EBAY_COMPS_LIMIT_INPUT}" \
                --max-queries "${GOONERS_EBAY_COMPS_MAX_QUERIES_INPUT}" \
                --monthly-budget "${GOONERS_EBAY_COMPS_MONTHLY_BUDGET_INPUT}" \
                --queries-per-item "${GOONERS_EBAY_COMPS_QUERIES_PER_ITEM_INPUT}" $SKIP_FLAG $PACING_FLAG
          fi

      - name: Commit and push
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # In Supabase mode comps go to the DB and no JSON is written, so the
          # ebay-comps dir may not exist — only stage it when present, and never
          # let a missing path abort the step (bash -e).
          if [ -d public/data/ebay-comps ]; then
            git add public/data/ebay-comps/
          fi
          if git diff --staged --quiet; then
            echo "No eBay comp changes to commit"
            exit 0
          fi
          git commit -m "data: refresh eBay comps [$(date -u +%Y-%m-%dT%H:%M)]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed; rebasing on origin/main before retry ${attempt}"
            git fetch origin main
            git rebase origin/main
          done
          git push
