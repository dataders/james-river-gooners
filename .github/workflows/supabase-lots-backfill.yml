name: Backfill Lots to Supabase

# One-time (and re-runnable) backfill of all existing NDJSON files into the
# Supabase `lots` table (issue #98). Reads the committed active + archive read
# model and upserts every lot, so re-running is fully idempotent.
#
# Requires SUPABASE_SECRET_KEY (writes bypass RLS). Safe to run at any time —
# it never modifies the NDJSON/Parquet files or the manifests.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which lots to backfill'
        required: false
        type: choice
        options:
          - both
          - active-only
          - archived-only
        default: both

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Backfill lots to Supabase
        run: |
          cd scraper
          if [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "SUPABASE_SECRET_KEY not set — skipping"
            exit 1
          fi
          SCOPE_FLAG="--backfill"
          if [ "${{ inputs.scope }}" = "active-only" ]; then
            SCOPE_FLAG="--backfill --active-only"
          elif [ "${{ inputs.scope }}" = "archived-only" ]; then
            SCOPE_FLAG="--backfill --archived-only"
          fi
          uv run --with requests python supabase_lots.py $SCOPE_FLAG
