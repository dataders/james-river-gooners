name: Post User Feedback as Issues

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 am UTC

permissions:
  issues: write

jobs:
  post-feedback:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch unprocessed feedback and open GitHub issues
        run: |
          python3 - <<'PYEOF'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          supabase_url = os.environ.get('SUPABASE_URL', '').rstrip('/')
          secret_key   = os.environ.get('SUPABASE_SECRET_KEY', '')
          gh_token     = os.environ.get('GH_TOKEN', '')
          repo         = os.environ.get('GITHUB_REPOSITORY', 'dataders/james-river-gooners')

          if not (supabase_url and secret_key):
              print('Supabase not configured — skipping')
              raise SystemExit(0)

          sb_headers = {
              'apikey': secret_key,
              'Authorization': f'Bearer {secret_key}',
              'Content-Type': 'application/json',
          }
          gh_headers = {
              'Authorization': f'Bearer {gh_token}',
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def gh_request(method, path, data=None):
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(
                  f'https://api.github.com{path}', data=body, headers=gh_headers, method=method,
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Ensure the feedback label exists (creates it on first run).
          try:
              labels = gh_request('GET', f'/repos/{repo}/labels')
              if not any(l['name'] == 'feedback' for l in labels):
                  gh_request('POST', f'/repos/{repo}/labels', {
                      'name': 'feedback',
                      'color': '0075ca',
                      'description': 'User-submitted feedback',
                  })
                  print("Created 'feedback' label")
          except Exception as exc:
              print(f'Label setup warning (non-fatal): {exc}')

          # Fetch rows that have not yet been turned into issues.
          req = urllib.request.Request(
              f'{supabase_url}/rest/v1/user_feedback?processed_at=is.null&order=submitted_at.asc',
              headers=sb_headers,
          )
          with urllib.request.urlopen(req) as r:
              rows = json.loads(r.read())

          print(f'Found {len(rows)} unprocessed feedback rows')

          for row in rows:
              submitted   = row['submitted_at'][:10]
              email_line  = f"\n\n**From:** {row['user_email']}" if row.get('user_email') else ''
              issue_body  = f'**Submitted:** {submitted}{email_line}\n\n---\n\n{row["message"]}'

              try:
                  issue = gh_request('POST', f'/repos/{repo}/issues', {
                      'title':  f'User feedback — {submitted}',
                      'body':   issue_body,
                      'labels': ['feedback'],
                  })
                  issue_url = issue['html_url']
                  print(f'Created issue: {issue_url}')
              except urllib.error.HTTPError as exc:
                  print(f'Failed to create issue: {exc}: {exc.read().decode()}')
                  continue

              # Mark row as processed so it is not re-processed next run.
              now        = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
              patch_body = json.dumps({'github_issue_url': issue_url, 'processed_at': now}).encode()
              patch_req  = urllib.request.Request(
                  f'{supabase_url}/rest/v1/user_feedback?id=eq.{row["id"]}',
                  data=patch_body,
                  headers={**sb_headers, 'Prefer': 'return=minimal'},
                  method='PATCH',
              )
              with urllib.request.urlopen(patch_req):
                  pass
              print(f'Marked {row["id"]} as processed')
          PYEOF
