name: Deploy to GitHub Pages

# Deploy only after the Test workflow succeeds on main, so a red build never
# ships. Manual runs (workflow_dispatch) bypass the gate for emergency deploys.
on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Gate: only build when manually dispatched, or when the triggering Test run passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Publishable key only — safe to embed in the public bundle given RLS.
          # The secret key (SUPABASE_SECRET_KEY) must never be set here.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # PostHog ingestion key — write-only, safe to embed in the public
          # bundle. Optional: telemetry is simply off if the secret is unset.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          # Cloudflare Worker for item-specific OG share previews.
          VITE_OG_WORKER_URL: ${{ secrets.VITE_OG_WORKER_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
