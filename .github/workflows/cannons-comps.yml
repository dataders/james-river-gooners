name: Refresh Cannon's Comps

# Precomputes "Cannon's comps" — for each active item, the most similar past
# (archived) lots and what they sold for — via the Nomic pgvector
# `match_cannons_comps` RPC (the vector search runs server-side in Postgres
# against nomic_embeddings + sold_lots). Writes them to the Supabase
# `cannons_comp_snapshots` table (the auth-gated read model, #132 part 3 / #150).
#
# Lightweight now: no model, no committed .embeddings — just RPC calls, so it
# needs only `requests`. The embeddings come from the scrape's incremental embed
# step + the "Backfill Nomic Embeddings" workflow (the archive corpus).
#
# Does NOT re-scrape auctions or rebuild manifests — use "Scrape Auction Data".

on:
  workflow_dispatch:
    inputs:
      top_k:
        description: 'Max comps to keep per item'
        required: false
        type: string
        default: '3'
      min_sim:
        description: 'Minimum cosine similarity (0-1) for a comp to count'
        required: false
        type: string
        default: '0.80'
      active_limit:
        description: 'Only process the first N active auctions (blank = all)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Compute but do not commit'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  comps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build Cannon's comps
        env:
          GOONERS_CANNONS_COMPS_TOP_K: ${{ inputs.top_k }}
          GOONERS_CANNONS_COMPS_MIN_SIM: ${{ inputs.min_sim }}
          GOONERS_CANNONS_COMPS_ACTIVE_LIMIT: ${{ inputs.active_limit }}
          GOONERS_CANNONS_COMPS_DRY_RUN: ${{ inputs.dry_run }}
          # Secret key (service_role) → reads nomic_embeddings/sold_lots via the
          # RPC and writes to cannons_comp_snapshots, bypassing RLS. Required.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Server-side telemetry (scraper/telemetry.py): the cannons_comps_completed
          # run summary to PostHog. No-op without the key.
          GOONERS_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: |
          cd scraper
          args=(--from-supabase)
          if [ -n "${GOONERS_CANNONS_COMPS_ACTIVE_LIMIT}" ]; then
            args+=(--active-limit "${GOONERS_CANNONS_COMPS_ACTIVE_LIMIT}")
          fi
          if [ "${GOONERS_CANNONS_COMPS_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          # --from-supabase: the read-model manifest isn't committed, so read the
          # active-auction list from the Supabase lots table instead.
          uv run --with requests --with posthog python cannons_comps.py "${args[@]}"
