name: Re-rank eBay Comps (hybrid)

# SoldComps Phase 2 / RFC #290, increment 2. Off the hourly hot path: embeds the
# sold-listings corpus with the Nomic text+vision models, then re-ranks each
# active lot's candidate comps by hybrid text+image similarity and writes the best K
# back into ebay_comp_snapshots (source_query='hybrid'). Manual-dispatch while
# the corpus is small / being validated; add a schedule once it's proven.

on:
  # Daily, off-peak: embed the listings captured by the hourly comp runs and
  # re-rank, so the corpus stays fresh for corpus-first reuse. Incremental — only
  # new listings are embedded, so most runs are cheap despite loading the models.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      step:
        description: 'embed (generate listing embeddings) | rerank (write visual comps) | all'
        required: false
        type: choice
        options: [all, embed, rerank]
        default: all
      item_ids:
        description: 'Comma-separated ebay_item_ids to embed (targeted mode; leave blank for incremental)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # CPU-only torch wheel index: avoids downloading ~3 GB of CUDA packages
      # that the GitHub-hosted runner can't use anyway, keeping the install
      # under ~250 MB and well inside the runner's disk budget.
      UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      # Force unbuffered stdout so progress prints appear immediately in CI
      # logs rather than being batched and lost if the runner cancels the job.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-embed-sold-cpu-${{ runner.os }}-${{ hashFiles('scraper/embed_sold_listings.py') }}
          restore-keys: uv-embed-sold-cpu-${{ runner.os }}-

      - name: Cache HuggingFace models (Nomic)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          # Shared key with nomic-backfill.yml so the two jobs reuse the same
          # cached model weights rather than each downloading 1 GB separately.
          key: huggingface-clip-vit-b-32-nomic-embed-v1.5

      - name: Embed + re-rank the sold-listings corpus
        env:
          GOONERS_EMBED_SOLD_STEP: ${{ inputs.step || 'all' }}
          GOONERS_EMBED_SOLD_ITEM_IDS: ${{ inputs.item_ids }}
        run: |
          cd scraper
          # Same Nomic stack as the lot embeddings (#165): einops for nomic_bert's
          # trust_remote_code, transformers==4.49.0 for the vision config, torchvision
          # for the image processor.
          uv run --with requests --with 'pydantic-settings>=2,<3' \
            --with sentence-transformers --with 'transformers==4.49.0' \
            --with torchvision --with pillow --with einops \
            python embed_sold_listings.py --step "${GOONERS_EMBED_SOLD_STEP}" \
            ${GOONERS_EMBED_SOLD_ITEM_IDS:+--item-ids "$GOONERS_EMBED_SOLD_ITEM_IDS"}
