name: Test

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push to a PR cancels the in-flight run for the old
# commit. Stops stacked runs from compounding load on the free-tier Supabase
# (every E2E/usability worker pulls the full ~6.5K-lot dataset) and kills
# zombie pile-ups instead of letting them grind to their timeout ceilings.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      # Bundle-size ratchet: fails if the gzipped JS grows past the budget.
      - run: npm run bundle:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      # One-way guards: typed-file floor, untyped-file ceiling, suppression ceiling.
      - run: npm run ratchets

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:unit:coverage

  scraper:
    name: Scraper tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run scraper unit tests
        run: |
          cd scraper
          uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml \
            --with 'duckdb==1.5.2' --with numpy --with pytest python -m pytest -q

  github-stats:
    name: GitHub-stats tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run github_stats unit tests
        run: |
          cd github_stats
          uv run --with requests --with pytest python -m pytest -q

      - name: Lint github_stats (ruff)
        run: |
          cd github_stats
          uvx ruff@0.15.8 check .

  supabase-stats:
    name: Supabase-stats tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run supabase_stats unit tests
        run: |
          cd supabase_stats
          uv run --with requests --with pytest python -m pytest -q

      - name: Lint supabase_stats (ruff)
        run: |
          cd supabase_stats
          uvx ruff@0.15.8 check .

  supabase-app:
    name: Supabase-app tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run supabase_app unit tests
        run: |
          cd supabase_app
          uv run --with requests --with pytest python -m pytest -q

      - name: Lint supabase_app (ruff)
        run: |
          cd supabase_app
          uvx ruff@0.15.8 check .

  pipeline-meta:
    name: Pipeline-meta tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run pipeline_meta unit tests
        run: |
          cd pipeline_meta
          uv run --with pytest python -m pytest -q

      - name: Lint pipeline_meta (ruff)
        run: |
          cd pipeline_meta
          uvx ruff@0.15.8 check .

  scraper-lint:
    name: Scraper lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # Blocking: ruff's default rules (incl. pyflakes F-codes) catch real bugs
      # like names used before assignment — exactly the class of error a unit
      # test on a network-bound scrape path would not.
      - name: Run ruff
        run: |
          cd scraper
          uvx ruff@0.15.8 check .

  scraper-type-check:
    name: Scraper type check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # Ratchet (replaces the old advisory continue-on-error step): ty's
      # diagnostic count may not RISE above the baseline, so a new type error
      # fails CI while the existing noise is tolerated. Lower the baseline in
      # scripts/ty-ratchet.sh as the scraper gets typed.
      - name: Run ty ratchet
        run: bash scripts/ty-ratchet.sh

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # Hard ceiling backstop. The suite runs against the in-process Supabase mock
    # (no slow prod DB), so a healthy run is ~1-2 minutes; anything past 10 means
    # the runner is wedged, not slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # No Supabase secrets / warm-up: the E2E suite serves all data from the
      # in-process mock (tests/e2e/_mock) and the dev server is pinned to a
      # dead-end Supabase URL (playwright.config webServer.env), so this job
      # never touches the production database.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  usability:
    name: Usability benchmark
    runs-on: ubuntu-latest
    # Hard ceiling backstop. Against the in-process mock (no live DB) a healthy
    # benchmark is ~1-2 minutes; past 10 the runner is wedged, not slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # No Supabase secrets / warm-up: the benchmark serves all data from the
      # in-process mock (tests/e2e/_mock) and the dev server is pinned to a
      # dead-end Supabase URL (playwright.usability.config webServer.env), so
      # this job never touches the production database.
      - name: Run usability benchmark
        run: npm run test:usability

      - name: Check usability score gate
        run: node tests/usability/check-score.js
        env:
          USABILITY_GATE: '85'

      - name: Upload usability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usability-report
          path: tests/usability/results/
          retention-days: 14
