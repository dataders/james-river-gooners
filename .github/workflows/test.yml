name: Test

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push to a PR cancels the in-flight run for the old
# commit. Stops stacked runs from compounding load on the free-tier Supabase
# (every E2E/usability worker pulls the full ~6.5K-lot dataset) and kills
# zombie pile-ups instead of letting them grind to their timeout ceilings.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the repo (checkout + test/lint); none commit or
# comment, so a read-only token is all they need.
permissions:
  contents: read

jobs:
  # Detects which parts of the repo a PR touches so downstream jobs can skip
  # work that's irrelevant to the diff. On push to main every job runs
  # unconditionally (safety net), so the gating only fast-paths PRs.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      scraper: ${{ steps.filter.outputs.scraper }}
      github_stats: ${{ steps.filter.outputs.github_stats }}
      supabase_stats: ${{ steps.filter.outputs.supabase_stats }}
      supabase_app: ${{ steps.filter.outputs.supabase_app }}
      pipeline_meta: ${{ steps.filter.outputs.pipeline_meta }}
      mcp: ${{ steps.filter.outputs.mcp }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v7

      # Each scope lists every path whose change should force that scope's
      # jobs to run. `.github/workflows/test.yml` appears in all of them so
      # a change to this gating logic is itself validated by every job.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - '.github/workflows/test.yml'
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'vitest.config.js'
              - 'vitest.setup.js'
              - 'eslint.config.js'
              - 'tsconfig.json'
              - 'scripts/ratchets.mjs'
              - 'scripts/ratchets.json'
              - 'scripts/bundle-size.mjs'
              - 'scripts/coverage-check.mjs'
              - 'scripts/dead-exports-ratchet.mjs'
              - 'scripts/lib-ratchet.mjs'
            e2e:
              - '.github/workflows/test.yml'
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'eslint.config.js'
              - 'tsconfig.json'
              - 'playwright.config.js'
              - 'playwright.usability.config.js'
              - 'tests/e2e/**'
              - 'tests/usability/**'
            scraper:
              - '.github/workflows/test.yml'
              - 'scraper/**'
              - 'ruff.toml'
              - 'scripts/ty-ratchet.sh'
            github_stats:
              - '.github/workflows/test.yml'
              - 'github_stats/**'
              - 'ruff.toml'
              - 'scripts/ty-ratchet.sh'
            supabase_stats:
              - '.github/workflows/test.yml'
              - 'supabase_stats/**'
              - 'ruff.toml'
              - 'scripts/ty-ratchet.sh'
            supabase_app:
              - '.github/workflows/test.yml'
              - 'supabase_app/**'
              - 'ruff.toml'
              - 'scripts/ty-ratchet.sh'
            pipeline_meta:
              - '.github/workflows/test.yml'
              - 'pipeline_meta/**'
              - 'ruff.toml'
              - 'scripts/ty-ratchet.sh'
            mcp:
              - '.github/workflows/test.yml'
              - 'mcp/**'
              - 'ruff.toml'
              - 'scripts/ty-ratchet.sh'
            dashboard:
              - '.github/workflows/test.yml'
              - 'dashboard/**'
              - 'ruff.toml'
              - 'scripts/ty-ratchet.sh'

  build:
    name: Production build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      # Bundle-size ratchet: fails if the gzipped JS grows past the budget.
      - run: npm run bundle:check

  lint:
    name: Lint
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      # One-way guards: typed-file floor, untyped-file ceiling, suppression/any ceilings.
      - run: npm run ratchets
      # Dead-exports ceiling: unused exports can only go down, never up.
      - run: npm run dead-exports:ratchet

  unit:
    name: Unit tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:unit:coverage

  scraper:
    name: Scraper tests (pytest)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run scraper unit tests
        run: |
          cd scraper
          uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml \
            --with 'duckdb==1.5.2' --with numpy --with 'pydantic-settings>=2,<3' \
            --with pytest python -m pytest -q

  github-stats:
    name: GitHub-stats tests (pytest)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.github_stats == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run github_stats unit tests
        run: |
          cd github_stats
          uv run --with requests --with pytest python -m pytest -q

      - name: Lint github_stats (ruff)
        run: |
          cd github_stats
          uvx ruff@0.15.8 check .

      - name: Run ty ratchet (github_stats)
        run: bash scripts/ty-ratchet.sh github_stats 0

  supabase-stats:
    name: Supabase-stats tests (pytest)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.supabase_stats == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run supabase_stats unit tests
        run: |
          cd supabase_stats
          uv run --with requests --with pytest python -m pytest -q

      - name: Lint supabase_stats (ruff)
        run: |
          cd supabase_stats
          uvx ruff@0.15.8 check .

      - name: Run ty ratchet (supabase_stats)
        run: bash scripts/ty-ratchet.sh supabase_stats 0

  supabase-app:
    name: Supabase-app tests (pytest)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.supabase_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run supabase_app unit tests
        run: |
          cd supabase_app
          uv run --with requests --with pytest python -m pytest -q

      - name: Lint supabase_app (ruff)
        run: |
          cd supabase_app
          uvx ruff@0.15.8 check .

      - name: Run ty ratchet (supabase_app)
        run: bash scripts/ty-ratchet.sh supabase_app 0

  pipeline-meta:
    name: Pipeline-meta tests (pytest)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.pipeline_meta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run pipeline_meta unit tests
        run: |
          cd pipeline_meta
          uv run --with pytest python -m pytest -q

      - name: Lint pipeline_meta (ruff)
        run: |
          cd pipeline_meta
          uvx ruff@0.15.8 check .

      - name: Run ty ratchet (pipeline_meta)
        run: bash scripts/ty-ratchet.sh pipeline_meta 0

  mcp:
    name: MCP tests (pytest)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run mcp unit tests
        run: |
          cd mcp
          uv run --extra dev pytest -q

      - name: Lint mcp (ruff)
        run: |
          cd mcp
          uvx ruff@0.15.8 check .

      - name: Run ty ratchet (mcp)
        run: bash scripts/ty-ratchet.sh mcp 0

  dashboard:
    name: Dashboard lint + type check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint dashboard (ruff)
        run: |
          cd dashboard
          uvx ruff@0.15.8 check .

      - name: Run ty ratchet (dashboard)
        run: bash scripts/ty-ratchet.sh dashboard 0

  scraper-lint:
    name: Scraper lint (ruff)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Blocking: ruff's default rules (incl. pyflakes F-codes) catch real bugs
      # like names used before assignment — exactly the class of error a unit
      # test on a network-bound scrape path would not.
      - name: Run ruff
        run: |
          cd scraper
          uvx ruff@0.15.8 check .

  scraper-type-check:
    name: Scraper type check (ty)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Ratchet: the scraper is ty-clean (baseline 0); a new type error fails CI.
      - name: Run ty ratchet
        run: bash scripts/ty-ratchet.sh scraper 0

  e2e:
    name: E2E tests (Playwright)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Hard ceiling backstop. The suite runs against the in-process Supabase mock
    # (no slow prod DB), so a healthy run is ~1-2 minutes; anything past 10 means
    # the runner is wedged, not slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # No Supabase secrets / warm-up: the E2E suite serves all data from the
      # in-process mock (tests/e2e/_mock) and the dev server is pinned to a
      # dead-end Supabase URL (playwright.config webServer.env), so this job
      # never touches the production database.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  usability:
    name: Usability benchmark
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Hard ceiling backstop. Against the in-process mock (no live DB) a healthy
    # benchmark is ~1-2 minutes; past 10 the runner is wedged, not slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # No Supabase secrets / warm-up: the benchmark serves all data from the
      # in-process mock (tests/e2e/_mock) and the dev server is pinned to a
      # dead-end Supabase URL (playwright.usability.config webServer.env), so
      # this job never touches the production database.
      - name: Run usability benchmark
        run: npm run test:usability

      - name: Check usability score gate
        run: node tests/usability/check-score.js
        env:
          USABILITY_GATE: '85'

      - name: Upload usability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usability-report
          path: tests/usability/results/
          retention-days: 14
