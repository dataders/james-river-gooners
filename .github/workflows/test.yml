name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:unit:coverage

  scraper:
    name: Scraper tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run scraper unit tests
        run: |
          cd scraper
          uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml \
            --with 'duckdb==1.5.2' --with numpy --with pytest python -m pytest -q

  github-stats:
    name: GitHub-stats tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run github_stats unit tests
        run: |
          cd github_stats
          uv run --with requests --with pytest python -m pytest -q

      - name: Lint github_stats (ruff)
        run: |
          cd github_stats
          uvx ruff@0.15.8 check .

  supabase-stats:
    name: Supabase-stats tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run supabase_stats unit tests
        run: |
          cd supabase_stats
          uv run --with requests --with pytest python -m pytest -q

      - name: Lint supabase_stats (ruff)
        run: |
          cd supabase_stats
          uvx ruff@0.15.8 check .

  scraper-lint:
    name: Scraper lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # Blocking: ruff's default rules (incl. pyflakes F-codes) catch real bugs
      # like names used before assignment — exactly the class of error a unit
      # test on a network-bound scrape path would not.
      - name: Run ruff
        run: |
          cd scraper
          uvx ruff@0.15.8 check .

  scraper-type-check:
    name: Scraper type check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # Non-blocking for now: ty is pre-1.0 and the scraper is largely untyped.
      # continue-on-error lives on the step (not the job) so a non-zero ty exit
      # surfaces as a warning annotation while the job's check still reports
      # green — advisory, without a scary red X on the PR.
      - name: Run ty
        continue-on-error: true
        run: |
          cd scraper
          uvx ty@0.0.44 check .

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # Hard ceiling: a healthy run takes ~8 minutes end to end and Playwright's
    # globalTimeout aborts a wedged run at 15 — if the job is still going at 20
    # something is hung outside the test runner. Without this, GitHub's 6-hour
    # default applies (a backend outage once ran this job for 2h42m).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Warm up Supabase database
        run: |
          curl -sf -o /dev/null \
            "$VITE_SUPABASE_URL/rest/v1/public_active_lots?select=count&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" || true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  usability:
    name: Usability benchmark
    runs-on: ubuntu-latest
    # Hard ceiling mirroring the e2e job: healthy run ~4 minutes, Playwright
    # globalTimeout aborts at 10 — past 15 the job is hung, not slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Warm up Supabase database
        run: |
          curl -sf -o /dev/null \
            "$VITE_SUPABASE_URL/rest/v1/public_active_lots?select=count&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" || true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Run usability benchmark
        run: npm run test:usability
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Check usability score gate
        run: node tests/usability/check-score.js
        env:
          USABILITY_GATE: '85'

      - name: Upload usability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usability-report
          path: tests/usability/results/
          retention-days: 14
