name: GitHub Repo Stats

# Loads this repo's GitHub activity (issues, PRs, commits, Actions workflow runs
# + scraper "items processed" parsed from run logs) into MotherDuck via dlt. dlt
# manages the `github_stats` schema and incremental state in md:my_db; the
# derived stats are dbt models (dbt/models/marts/engineering/) built on these
# raw tables — same warehouse the dashboard reads, no Postgres hop.
#
# Reads the MOTHERDUCK_TOKEN secret (a read/write PAT). MotherDuck is reached
# over HTTPS, so any runner works. The job skips if the token is unset.

on:
  schedule:
    # Hourly, a few minutes past the hour so it trails the scrape/deploy runs.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How far back to pull on first load / for new entities'
        required: false
        type: string
        default: '180'
      max_log_runs:
        description: 'Cap on workflow-run logs downloaded this run'
        required: false
        type: string
        default: '60'

permissions:
  contents: read
  # Needed to download workflow-run logs (the items-processed source).
  actions: read

# Don't stack hourly runs if one is slow.
concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  github-stats:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Load GitHub stats to MotherDuck
        run: |
          cd github_stats
          if [ -z "${MOTHERDUCK_TOKEN:-}" ]; then
            echo "MOTHERDUCK_TOKEN not set — skipping GitHub-stats load"
            exit 0
          fi
          LOOKBACK="${{ inputs.lookback_days || '180' }}"
          MAX_LOGS="${{ inputs.max_log_runs || '60' }}"
          uv run --with "dlt[motherduck]" --with requests \
            python pipeline.py --lookback-days "$LOOKBACK" --max-log-runs "$MAX_LOGS"
