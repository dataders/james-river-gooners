name: GitHub Repo Stats

# Loads this repo's GitHub activity (issues, PRs, commits, Actions workflow runs
# + scraper "items processed" parsed from run logs) into Postgres via dlt. dlt
# manages the `github_stats` schema and incremental state in the destination;
# derived stats are SQL views (see github_stats/views.sql), re-applied each run.
#
# Reads the SUPABASE_POSTGRES_URL secret — the Supabase Postgres connection
# string. dlt needs a direct DB connection, not the PostgREST endpoint the
# scrapers use. NOTE: GitHub-hosted runners are IPv4-only, and Supabase's
# direct host (db.<ref>.supabase.co) is IPv6-only — so this secret must hold
# the **session pooler** URL (aws-0-<region>.pooler.supabase.com:5432,
# user postgres.<ref>) for the runner to connect. The job skips if it's unset.

on:
  # TEMP: branch-scoped push trigger to validate the pooler connection + first
  # load on a real runner before merge (workflow_dispatch needs the workflow on
  # the default branch). Removed before merge.
  push:
    branches: [claude/github-stats-dlt-pipeline-1ijhl9]
  schedule:
    # Hourly, a few minutes past the hour so it trails the scrape/deploy runs.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How far back to pull on first load / for new entities'
        required: false
        type: string
        default: '180'
      max_log_runs:
        description: 'Cap on workflow-run logs downloaded this run'
        required: false
        type: string
        default: '60'

permissions:
  contents: read
  # Needed to download workflow-run logs (the items-processed source).
  actions: read

# Don't stack hourly runs if one is slow.
concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  github-stats:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_POSTGRES_URL: ${{ secrets.SUPABASE_POSTGRES_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Load GitHub stats to Postgres
        run: |
          cd github_stats
          if [ -z "${SUPABASE_POSTGRES_URL:-}" ]; then
            echo "SUPABASE_POSTGRES_URL not set — skipping GitHub-stats load"
            exit 0
          fi
          LOOKBACK="${{ inputs.lookback_days || '180' }}"
          MAX_LOGS="${{ inputs.max_log_runs || '60' }}"
          uv run --with "dlt[postgres]" --with requests \
            python pipeline.py --lookback-days "$LOOKBACK" --max-log-runs "$MAX_LOGS"
