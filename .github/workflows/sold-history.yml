name: Refresh Sold-Price History

# Mirrors closed-lot sold prices from the Supabase ``lots`` table (archived rows)
# into ``sold_lots`` so the browser can read per-item history and per-category
# medians (issue #95 / M3.2). The upsert is keyed on (auction_safe_id, item_id),
# so running repeatedly is idempotent.
#
# Reads archived lots directly from Supabase — no committed NDJSON files needed.
#
# Requires SUPABASE_SECRET_KEY (reads lots, writes sold_lots, bypasses RLS).

on:
  schedule:
    # Daily at 04:00 UTC, after the hourly scrape has archived any freshly-closed
    # auctions.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build rows and report the count without writing to Supabase'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sold-history:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Upsert sold-price history to Supabase
        run: |
          cd scraper
          if [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "SUPABASE_SECRET_KEY not set — skipping sold-history upsert"
            exit 0
          fi
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          uv run --with requests \
            python sold_history.py --from-supabase $DRY_FLAG
