name: Enrich Backfill (LLM)

# Manual, re-runnable LLM enrichment backfill (issue #104 / PR #195). Reads
# lots from the Supabase ``lots`` table, enriches them via the OpenAI Batch
# API (50% cost), and upserts results to ``lot_enrichment``. No NDJSON files
# are read or written.
#
# Durable + resumable: enrichment is keyed on ``input_hash`` stored in
# ``lot_enrichment``, so a re-dispatch reuses already-enriched lots and only
# spends on new/changed ones.
#
# Requires OPENAI_API_KEY + VITE_SUPABASE_URL + SUPABASE_SECRET_KEY.

on:
  workflow_dispatch:
    inputs:
      safe_ids:
        description: 'Space-separated auction safeIds to enrich (blank = all active + archive)'
        required: false
        type: string
      estimate_only:
        description: 'Pre-flight only — count tokens on a sample and print the estimated cost, do not enrich'
        required: false
        type: boolean
        default: false
      text_only:
        description: 'Text-only — drop photos, enrich from the lot text alone (much cheaper; for text-derivable fields)'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Cap the number of lots enriched (a small validation slice; blank = no cap)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  enrich-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GOONERS_ENRICHMENT: '1'
      # Server-side enrichment telemetry (scraper/telemetry.py): the batch
      # submitted/completed/failed events to PostHog. No-op without the key.
      GOONERS_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Run enrichment backfill
        env:
          GOONERS_ENRICH_SAFE_IDS: ${{ inputs.safe_ids }}
          GOONERS_ENRICH_ESTIMATE_ONLY: ${{ inputs.estimate_only }}
          GOONERS_ENRICH_TEXT_ONLY: ${{ inputs.text_only }}
          GOONERS_ENRICH_LIMIT: ${{ inputs.limit }}
        run: |
          cd scraper
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY not set — cannot enrich"
            exit 1
          fi
          if [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "SUPABASE_SECRET_KEY not set — cannot read/write Supabase"
            exit 1
          fi
          args=(--batch --from-supabase)
          if [ "${GOONERS_ENRICH_ESTIMATE_ONLY}" = "true" ]; then
            args+=(--estimate-only)
          fi
          if [ "${GOONERS_ENRICH_TEXT_ONLY}" = "true" ]; then
            args+=(--text-only)
          fi
          if [ -n "${GOONERS_ENRICH_LIMIT}" ]; then
            args+=(--limit "${GOONERS_ENRICH_LIMIT}")
          fi
          read -r -a safe_id_args <<< "${GOONERS_ENRICH_SAFE_IDS}"
          uv run --with openai --with requests --with pillow \
            python enrich.py "${args[@]}" "${safe_id_args[@]}"
