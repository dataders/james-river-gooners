# Supabase advisor ratchet — fails if the live project gains a NEW security or
# performance advisor finding (scripts/supabase-advisors-ratchet.mjs vs the
# committed baseline). Advisors reflect the LIVE database, so this runs on a
# schedule (catches drift after a migration is applied), on demand, and on PRs
# that touch migrations or the ratchet itself.
#
# Needs a SUPABASE_ACCESS_TOKEN secret (a PAT, sbp_…); SKIPS CLEANLY when it's
# absent so it's inert rather than red until configured.
name: Supabase advisors

on:
  schedule:
    - cron: '0 12 * * 1' # weekly, Monday 12:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/supabase-advisors-ratchet.mjs'
      - 'scripts/supabase-advisors-baseline.json'
      - '.github/workflows/supabase-advisors.yml'

permissions:
  contents: read

jobs:
  advisors:
    name: No new DB advisors
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check Supabase advisors against baseline
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping advisor ratchet."
            exit 0
          fi
          node scripts/supabase-advisors-ratchet.mjs
