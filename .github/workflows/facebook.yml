name: Scrape Facebook Marketplace

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max Facebook listings per active/sold search'
        required: false
        type: string
        default: '60'

permissions:
  contents: read

jobs:
  facebook:
    runs-on: ubuntu-latest
    env:
      GOONERS_APIFY_TOKEN: ${{ secrets.GOONERS_APIFY_TOKEN }}
      APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOONERS_ENRICHMENT: '1'
      GOONERS_NOMIC_EMBEDDINGS: '1'
      FACEBOOK_LIMIT: ${{ inputs.limit || '60' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Cache HuggingFace models (Nomic)
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-nomic-embed-v1.5

      - name: Scrape Facebook Marketplace
        timeout-minutes: 35
        run: |
          cd scraper
          uv run --with requests --with pyarrow --with pyyaml --with beautifulsoup4 \
            --with sentence-transformers --with 'transformers==4.49.0' --with torchvision --with pillow --with einops --with anthropic \
            --with 'pydantic-settings>=2,<3' \
            python rescrape_all.py --source facebook --facebook-limit "$FACEBOOK_LIMIT"
