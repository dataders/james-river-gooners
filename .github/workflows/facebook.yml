name: Scrape Facebook Marketplace

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max Facebook listings per active/sold search'
        required: false
        type: string
        default: '60'

permissions:
  contents: read

jobs:
  facebook:
    runs-on: ubuntu-latest
    env:
      GOONERS_APIFY_TOKEN: ${{ secrets.GOONERS_APIFY_TOKEN }}
      APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOONERS_ENRICHMENT: '1'
      FACEBOOK_LIMIT: ${{ inputs.limit || '60' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@a9b33f02405f50e505f17ab8530e42a23200a5d1

      - name: Scrape Facebook Marketplace
        timeout-minutes: 35
        run: |
          cd scraper
          uv run --with requests --with pyarrow --with pyyaml --with beautifulsoup4 \
            --with openai --with pillow \
            --with 'pydantic-settings>=2,<3' \
            python rescrape_all.py --source facebook --facebook-limit "$FACEBOOK_LIMIT"
