name: Scrape Auction Data

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
    inputs:
      auction_url:
        description: 'Full Cannon''s auction URL (or leave empty to discover and scrape current auctions)'
        required: false
        type: string
      dry_run:
        description: 'Test only — scrape but do not commit'
        required: false
        type: boolean
        default: false
      sold_listings_corpus:
        description: 'Capture the full eBay candidate set into the sold_listings corpus (#293). Off on scheduled runs until validated.'
        required: false
        type: boolean
        default: false
      comps_limit:
        description: 'Max items to fetch comps for this run (small for a controlled corpus test; default matches the hourly run)'
        required: false
        type: string
        default: '2000'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      SOLDCOMPS_API_KEY: ${{ secrets.SOLDCOMPS_API_KEY }}
      # eBay comps → Supabase (#6). When these are set, Supabase is the comps
      # read model AND the scraper's ledger: the comp step writes to the table
      # and no per-run JSON is committed. Without them, the static JSON read
      # model is written and MotherDuck is an optional mirror.
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Nomic Embed (text+vision, 768-dim) → Supabase pgvector (#165). Always on
      # when Supabase is configured; no-op when SUPABASE_SECRET_KEY is absent so
      # local/offline scrapes are unaffected.
      GOONERS_NOMIC_EMBEDDINGS: '1'
      # LLM lot enrichment (#99/#104). Now ON for every run, including the hourly
      # schedule — quality has been validated, so new/changed lots are enriched
      # incrementally as they're scraped (reuse via input_hash means unchanged
      # lots never re-call the API, keeping the per-scrape cost to just the deltas).
      # The one-time historical catch-up is the separate `enrich-backfill.yml`.
      # No-op without ANTHROPIC_API_KEY, so local/offline scrapes are unaffected.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOONERS_ENRICHMENT: '1'
      # Server-side telemetry (scraper/telemetry.py): records the metered
      # SoldComps API calls + the provider's reported remaining quota to PostHog.
      # No-op when the key is absent. Reuses the existing VITE_POSTHOG_KEY secret
      # (same browser-safe, write-only ingestion key) — referencing a secret in a
      # run step does not put it in the frontend bundle, so there's no need for a
      # duplicate GOONERS_POSTHOG_KEY secret.
      GOONERS_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Cache HuggingFace models (Nomic)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-nomic-embed-v1.5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Scrape Cannon's (Maxanet) auctions
        id: scrape_maxanet
        continue-on-error: true
        # 45 min was too tight: with enrichment now reused (enrichment_seen cache)
        # the remaining per-auction cost is MotherDuck snapshot appends + bid
        # history across ~23 auctions, which ran ~45m13s. Bumped for headroom.
        timeout-minutes: 60
        run: |
          cd scraper
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: skipping MotherDuck listing snapshot writes"
          elif [ -n "${MOTHERDUCK_TOKEN:-}" ]; then
            export GOONERS_MOTHERDUCK_SNAPSHOTS=1
          fi
          if [ -n "${{ inputs.auction_url }}" ]; then
            echo "Scraping single auction..."
            uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml --with 'duckdb==1.5.2' \
              --with sentence-transformers --with 'transformers==4.49.0' --with torchvision --with pillow --with einops --with anthropic \
              python scrape.py "${{ inputs.auction_url }}"
          else
            echo "Re-scraping all Cannon's auctions..."
            uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml --with 'duckdb==1.5.2' \
              --with sentence-transformers --with 'transformers==4.49.0' --with torchvision --with pillow --with einops --with anthropic \
              python rescrape_all.py --source maxanet
          fi

      - name: Scrape HiBid auctions
        id: scrape_hibid
        if: ${{ !inputs.auction_url }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          cd scraper
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: skipping MotherDuck listing snapshot writes"
          elif [ -n "${MOTHERDUCK_TOKEN:-}" ]; then
            export GOONERS_MOTHERDUCK_SNAPSHOTS=1
          fi
          echo "Re-scraping HiBid auctions..."
          uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml --with 'duckdb==1.5.2' \
            --with sentence-transformers --with 'transformers==4.49.0' --with torchvision --with pillow --with einops --with anthropic \
            python rescrape_all.py --source hibid

      - name: Archive closed auctions and rebuild manifests
        if: ${{ !inputs.auction_url }}
        run: |
          cd scraper
          uv run --with requests --with beautifulsoup4 --with pyarrow --with pyyaml \
            python rescrape_all.py --archive-only

      - name: Install agent-browser Playwright deps
        run: |
          npm exec --yes agent-browser@0.27.0 -- install
        env:
          npm_config_cache: ${{ runner.temp }}/npm-agent-browser
          AGENT_BROWSER_ARGS: --no-sandbox,--disable-blink-features=AutomationControlled

      - name: Refresh eBay comps
        env:
          npm_config_cache: ${{ runner.temp }}/npm-agent-browser
          AGENT_BROWSER_ARGS: --no-sandbox,--disable-blink-features=AutomationControlled
          AGENT_BROWSER_SESSION: gooners-ebay-comps
          # Raw sold-listings corpus (#290/#294): capture the full ~40-listing
          # candidate set per query into `sold_listings`. On for every run now —
          # validated; it feeds the visual re-rank + corpus-first reuse.
          GOONERS_SOLD_LISTINGS_CORPUS: '1'
          # Corpus-first reuse (#290 inc 3): before spending a SoldComps call on a
          # lot, reuse the corpus when it already covers it with fresh, similar
          # sold listings (3 / 60d / 0.85). Validated — reuses the right comps and
          # skips the paid API. Falls through to the API when coverage is thin.
          GOONERS_CORPUS_FIRST: '1'
          # Small-batch knob for a controlled corpus test (defaults to the hourly
          # 2000); ebay_comps.py reads it as the --limit default.
          GOONERS_EBAY_COMPS_LIMIT: ${{ inputs.comps_limit || '2000' }}
        run: |
          cd scraper
          # Prefer Supabase (#6) when its secret is configured — it's the comps
          # read model the frontend reads AND the scraper's ledger, so no JSON
          # is written. Otherwise write the static JSON read model and mirror to
          # MotherDuck when its token is present.
          if [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            export GOONERS_WAREHOUSE=supabase
          elif [ -n "${MOTHERDUCK_TOKEN:-}" ]; then
            export GOONERS_MOTHERDUCK_SNAPSHOTS=1
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: planning eBay comp fetch without writes"
            uv run --with requests --with beautifulsoup4 --with pyarrow --with 'duckdb==1.5.2' \
              --with 'pydantic-settings>=2,<3' \
              python ebay_comps.py fetch-direct --dry-run --limit 1 --sleep-seconds 0
          else
            # Backfill mode: spend only on items without comps yet, soonest-ending
            # auctions first, capped by the shared monthly budget (paced daily).
            # Every run — hourly or the manual "Refresh eBay Comps" workflow —
            # draws from the same pool, derived from the read model itself, so
            # the pipeline never exceeds the SoldComps quota.
            uv run --with requests --with beautifulsoup4 --with pyarrow --with 'duckdb==1.5.2' --with posthog \
              --with 'pydantic-settings>=2,<3' \
              python ebay_comps.py fetch-direct \
                --skip-attempted \
                --queries-per-item 2 \
                --monthly-budget "${GOONERS_EBAY_COMPS_MONTHLY_BUDGET:-50000}" \
                --limit "${GOONERS_EBAY_COMPS_LIMIT:-2000}"
          fi

      - name: Fail if Cannon's scrape errored
        if: ${{ steps.scrape_maxanet.outcome == 'failure' }}
        run: |
          echo "Cannon's (Maxanet) scrape failed — see 'Scrape Cannon's' step above for details."
          exit 1
